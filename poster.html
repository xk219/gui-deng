<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜行归灯 · 海报</title>
<style>
  @page { margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  html,body{ background:#050810 }
  .poster{
    width:1080px; height:1440px; position:relative; overflow:hidden;
    background:
      radial-gradient(900px 620px at 50% 26%, #16263f 0%, #0a1220 45%, #04070e 78%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#eaf0f9;
    display:flex; flex-direction:column;
  }
  .glowline{position:absolute;inset:0;background:
     radial-gradient(520px 300px at 50% 78%, rgba(255,207,107,.10), transparent 70%);}
  .head{padding:74px 84px 0; position:relative; z-index:3}
  .kicker{font-size:22px; letter-spacing:.42em; color:#ffcf6b; opacity:.9}
  h1{font-size:104px; line-height:1.06; letter-spacing:.08em; margin:14px 0 10px;
     font-weight:700; text-shadow:0 0 44px rgba(255,207,107,.28)}
  .sub{font-size:27px; color:#a9bcd6; letter-spacing:.06em}
  .scene{margin:22px 0 0; position:relative; z-index:2}
  canvas{display:block; width:1080px; height:600px}
  .fade{position:absolute;left:0;right:0;bottom:-1px;height:150px;z-index:2;
    background:linear-gradient(180deg, rgba(4,7,14,0), #04070e 78%)}
  .body{padding:0 84px; position:relative; z-index:3; flex:1; display:flex; flex-direction:column}
  .rule{display:flex; gap:20px; align-items:flex-start; margin-bottom:16px}
  .n{flex:0 0 46px; height:46px; border-radius:50%; display:grid; place-items:center;
     background:linear-gradient(180deg,#ffd98a,#e8a33d); color:#231404; font-weight:700; font-size:22px}
  .rt{font-size:25px; line-height:1.55; color:#cfdaeb}
  .rt b{color:#fff}
  .ask{margin-top:6px; padding:20px 24px; border-left:3px solid #ffcf6b;
       background:rgba(255,207,107,.07); border-radius:0 14px 14px 0}
  .ask p{font-size:27px; line-height:1.5; color:#ffe9b8; font-weight:600}
  .ask span{display:block; font-size:20px; color:#9fb2ca; font-weight:400; margin-top:8px; letter-spacing:.04em}
  .foot{margin-top:auto; padding:0 84px 56px; display:flex; align-items:flex-end; justify-content:space-between; z-index:3}
  .url{font-size:24px; color:#ffcf6b; letter-spacing:.04em}
  .url small{display:block; color:#7d90ab; font-size:17px; letter-spacing:.16em; margin-bottom:6px}
  .seal{width:96px;height:96px;border:3px solid rgba(255,207,107,.55);border-radius:12px;
        display:grid;place-items:center;color:#ffcf6b;font-size:30px;letter-spacing:.1em;line-height:1.1;text-align:center}
</style>
</head>
<body>
<div class="poster">
  <div class="glowline"></div>

  <div class="head">
    <p class="kicker">收 集 · 一 条 规 则</p>
    <h1>夜行归灯</h1>
    <p class="sub">雪原上，影子只追光</p>
  </div>

  <div class="scene">
    <canvas id="scene" width="1080" height="600"></canvas>
    <div class="fade"></div>
  </div>

  <div class="body">
    <div class="rule"><span class="n">1</span><div class="rt">把散落的 <b>6 根灯芯</b> 送回灯座，大灯亮起就算完成。</div></div>
    <div class="rule"><span class="n">2</span><div class="rt"><b>影子只追光。</b>每多带一根灯芯，它们就看得更远、跑得更快。</div></div>
    <div class="rule"><span class="n">3</span><div class="rt"><b>灯座一次只收 3 根</b>，收完冷却 6 秒——多带的会陪你在原地等。</div></div>

    <div class="ask">
      <p>带满 3 根冲一趟，还是空手多跑两趟？</p>
      <span>看得见的地方变多了，看见你的东西也变多了。</span>
    </div>
  </div>

  <div class="foot">
    <div class="url"><small>扫描或直接在浏览器打开</small>xk219.github.io/gui-deng</div>
    <div class="seal">夜行<br>归灯</div>
  </div>
</div>

<script>
(() => {
  const c = document.getElementById('scene');
  const ctx = c.getContext('2d');
  const W = 1080, H = 600;
  let t = 0;

  function rnd(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  const rand = rnd(20261116);

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

  function draw() {
    t += 0.016;
    ctx.clearRect(0,0,W,H);

    // 天空
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#0b1526'); sky.addColorStop(.55,'#0a1220'); sky.addColorStop(1,'#070d18');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

    // 星
    for (let i = 0; i < 90; i++) {
      const x = (i * 97.3) % W, y = (i * 53.7) % 430;
      const a = 0.12 + (i % 7) * 0.06 + Math.sin(t * 1.6 + i) * 0.05;
      ctx.fillStyle = 'rgba(214,231,255,' + Math.max(0.05, a) + ')';
      ctx.beginPath(); ctx.arc(x, y, 0.9 + (i % 3) * 0.6, 0, 6.283); ctx.fill();
    }
    // 月晕
    const mg = ctx.createRadialGradient(880, 180, 8, 880, 180, 190);
    mg.addColorStop(0, 'rgba(200,224,255,.22)'); mg.addColorStop(1, 'rgba(200,224,255,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(880, 180, 190, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(206,224,250,.20)';
    ctx.beginPath(); ctx.arc(884, 178, 24, 0, 6.283); ctx.fill();
    ctx.strokeStyle='rgba(216,232,255,.18)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(884,178,24,0,6.283); ctx.stroke();

    // 远山
    ctx.fillStyle = '#0a1424';
    ctx.beginPath(); ctx.moveTo(0,430); ctx.quadraticCurveTo(180,330,380,420);
    ctx.quadraticCurveTo(560,330,780,415); ctx.quadraticCurveTo(950,340,W,420);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0c1830';
    ctx.beginPath(); ctx.moveTo(0,470); ctx.quadraticCurveTo(280,390,540,470);
    ctx.quadraticCurveTo(820,400,W,465); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();

    ctx.save();
    ctx.translate(W / 2 - 30, 600); ctx.scale(1.26, 1.26); ctx.translate(-W / 2, -600);

    // 雪地
    const gnd = ctx.createLinearGradient(0,450,0,H);
    gnd.addColorStop(0,'#0e1b2e'); gnd.addColorStop(1,'#0a1524');
    ctx.fillStyle = gnd; ctx.fillRect(0,450,W,H-450);
    for (let i=0;i<60;i++){
      const x = rand()*W, y = 470 + rand()*(H-470);
      ctx.fillStyle = 'rgba(170,205,240,'+(0.02+rand()*0.03)+')';
      ctx.beginPath(); ctx.ellipse(x,y,60+rand()*120,10+rand()*22,0,0,6.283); ctx.fill();
    }

    // 灯座（远处）
    const ax = 760, ay = 452;
    const ag = ctx.createRadialGradient(ax,ay,4,ax,ay,150);
    ag.addColorStop(0,'rgba(255,207,107,.35)'); ag.addColorStop(1,'rgba(255,207,107,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(ax,ay,150,0,6.283); ctx.fill();
    ctx.fillStyle = '#182a41'; ctx.beginPath(); ctx.ellipse(ax,ay+8,42,14,0,0,6.283); ctx.fill();
    ctx.fillStyle = '#ffd98a'; ctx.beginPath(); ctx.arc(ax,ay-4,9,0,6.283); ctx.fill();

    // 主光：提灯
    const px = 380, py = 470;
    const lp = ctx.createRadialGradient(px+26,py-42,6,px+26,py-42,330);
    lp.addColorStop(0,'rgba(255,236,190,.55)');
    lp.addColorStop(.35,'rgba(255,207,107,.20)');
    lp.addColorStop(1,'rgba(255,207,107,0)');
    ctx.fillStyle = lp; ctx.beginPath(); ctx.arc(px+26,py-42,330,0,6.283); ctx.fill();

    // 灯芯
    const cores = [[300,520],[520,486],[660,540]];
    cores.forEach(([x,y],i)=>{
      const pu = 1+Math.sin(t*2+i)*.12;
      const cg = ctx.createRadialGradient(x,y,0,x,y,34*pu);
      cg.addColorStop(0,'rgba(255,248,220,.95)');
      cg.addColorStop(.35,'rgba(255,207,107,.5)');
      cg.addColorStop(1,'rgba(255,207,107,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(x,y,34*pu,0,6.283); ctx.fill();
      ctx.fillStyle='#fff6da'; ctx.beginPath(); ctx.arc(x,y,4.2,0,6.283); ctx.fill();
    });

    // 脚下的雪影
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(px,py+34,30,9,0,0,6.283); ctx.fill();

    // 人物：斗篷 + 兜帽
    ctx.save(); ctx.translate(px,py);
    const cg2 = ctx.createLinearGradient(-34,-20,30,46);
    cg2.addColorStop(0,'#5b7da0'); cg2.addColorStop(1,'#1b2a3d');
    ctx.fillStyle = cg2;
    ctx.beginPath();
    ctx.moveTo(-26,-8); ctx.quadraticCurveTo(-46,34,-38,52);
    ctx.lineTo(30,52); ctx.quadraticCurveTo(40,26,24,-8); ctx.closePath(); ctx.fill();
    const hg = ctx.createLinearGradient(-22,-52,22,-8);
    hg.addColorStop(0,'#6b90b8'); hg.addColorStop(1,'#24384f');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0,-28,23,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(240,214,168,.9)'; ctx.beginPath(); ctx.arc(4,-24,7.5,0,6.283); ctx.fill();
    ctx.strokeStyle='rgba(255,214,140,.6)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-28,23,-1.1,.55); ctx.stroke();
    // 提灯
    ctx.strokeStyle='rgba(160,128,84,.95)'; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(22,-4); ctx.lineTo(38,-18); ctx.stroke();
    ctx.restore();

    // 提灯本体
    const lx = px+38, ly = py-18;
    ctx.fillStyle='#2a2118'; roundRect(lx-11,ly-14,22,28,6); ctx.fill();
    const lg2 = ctx.createRadialGradient(lx,ly,0,lx,ly,40);
    lg2.addColorStop(0,'rgba(255,248,220,1)'); lg2.addColorStop(.4,'rgba(255,214,140,.55)');
    lg2.addColorStop(1,'rgba(255,207,107,0)');
    ctx.fillStyle=lg2; ctx.beginPath(); ctx.arc(lx,ly,40,0,6.283); ctx.fill();
    ctx.fillStyle='#fff8e6'; ctx.beginPath(); ctx.arc(lx,ly,7,0,6.283); ctx.fill();

    // 绕圈的灯芯
    for (let i=0;i<5;i++){
      const a = t*1.4 + i/5*6.283;
      const x = px + Math.cos(a)*58, y = py-20 + Math.sin(a)*34;
      ctx.fillStyle='#fff3cf'; ctx.beginPath(); ctx.arc(x,y,4.4,0,6.283); ctx.fill();
      const gg = ctx.createRadialGradient(x,y,0,x,y,14);
      gg.addColorStop(0,'rgba(255,240,200,.7)'); gg.addColorStop(1,'rgba(255,207,107,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,14,0,6.283); ctx.fill();
    }

    // 影子
    [[700,505,1],[935,468,.62]].forEach(([sx,sy,s])=>{
      ctx.save(); ctx.globalAlpha=s;
      ctx.fillStyle='#03050a';
      ctx.beginPath(); ctx.ellipse(sx,sy,34,26,0,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy-24,22,0,6.283); ctx.fill();
      ctx.fillStyle='rgba(255,96,80,.95)';
      ctx.beginPath(); ctx.arc(sx-8,sy-27,3.6,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(sx+8,sy-27,3.6,0,6.283); ctx.fill();
      ctx.restore();
    });

    ctx.restore();

    // 雪
    for (let i=0;i<70;i++){
      const x = (i*137.5 + t*16*(1+i%3)) % W;
      const y = (i*211.7 + t*26*(1+i%4)) % H;
      ctx.fillStyle='rgba(226,240,255,'+(0.12+(i%5)*0.05)+')';
      ctx.beginPath(); ctx.arc(x,y,1+(i%3)*0.8,0,6.283); ctx.fill();
    }

    // 四周压暗
    const vg = ctx.createRadialGradient(W/2,H/2,240,W/2,H/2,720);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(2,4,9,.72)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
