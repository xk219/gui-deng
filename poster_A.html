<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜行归灯 · 海报 A 电影感</title>
<style>
  @page{margin:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1440px;height:1080px;overflow:hidden;background:#04070d}
  .poster{position:relative;width:1440px;height:1080px;overflow:hidden}
  canvas{display:block;width:1440px;height:1080px}
  .grain{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.7'/></svg>")}
</style>
</head>
<body>
<div class="poster">
  <canvas id="c" width="2880" height="2160"></canvas>
  <div class="grain"></div>
</div>
<script>
(() => {
  const C = document.getElementById('c');
  const ctx = C.getContext('2d');
  const W = 1440, H = 1080;
  ctx.scale(2, 2);                       // 2x 超采样

  let seed = 20261119;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const stars = Array.from({length: 260}, () => ({
    x: rnd()*W, y: rnd()*640, r: .4 + rnd()*1.5, a: .12 + rnd()*.55, big: rnd() > .93
  }));
  const flakes = Array.from({length: 190}, () => ({
    x: rnd()*W, y: rnd()*H, r: .8 + rnd()*2.2, a: .12 + rnd()*.45, d: rnd()*6.28, sp: .2 + rnd()*.9
  }));

  // ---------- 光晕离屏 ----------
  const bloomC = document.createElement('canvas');
  bloomC.width = 1440; bloomC.height = 1080;
  const bctx = bloomC.getContext('2d');

  function glow(x, y, r, color, alpha) {
    const g = bctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color.replace('ALPHA', alpha));
    g.addColorStop(.35, color.replace('ALPHA', alpha * .45));
    g.addColorStop(1, color.replace('ALPHA', 0));
    bctx.fillStyle = g;
    bctx.beginPath(); bctx.arc(x, y, r, 0, 6.283); bctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    bctx.clearRect(0, 0, W, H);

    /* ================= 天空 ================= */
    const sky = ctx.createLinearGradient(0, 0, 0, 720);
    sky.addColorStop(0, '#050b16');
    sky.addColorStop(.35, '#0a1a2e');
    sky.addColorStop(.68, '#102a44');
    sky.addColorStop(1, '#1b3f5f');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // 银河般的微光
    const mw = ctx.createRadialGradient(420, 260, 40, 420, 260, 620);
    mw.addColorStop(0, 'rgba(120,170,230,.10)');
    mw.addColorStop(.5, 'rgba(100,150,215,.045)');
    mw.addColorStop(1, 'rgba(90,140,205,0)');
    ctx.fillStyle = mw; ctx.fillRect(0, 0, W, 800);

    // 星星
    stars.forEach(s => {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#e8f2ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      if (s.big) {
        ctx.globalAlpha = s.a * .5;
        ctx.fillRect(s.x - 5, s.y - .4, 10, .8);
        ctx.fillRect(s.x - .4, s.y - 5, .8, 10);
      }
    });
    ctx.globalAlpha = 1;

    /* ================= 月 ================= */
    const MX = 1152, MY = 250, MR = 118;
    glow(MX, MY, 420, 'rgba(210,230,255,ALPHA)', .22);
    glow(MX, MY, 190, 'rgba(255,252,240,ALPHA)', .30);

    const md = ctx.createRadialGradient(MX - 34, MY - 40, 12, MX, MY, MR);
    md.addColorStop(0, '#fffefa');
    md.addColorStop(.55, '#f7f3e4');
    md.addColorStop(.88, '#e9e2ca');
    md.addColorStop(1, '#dcd4b8');
    ctx.fillStyle = md;
    ctx.beginPath(); ctx.arc(MX, MY, MR, 0, 6.283); ctx.fill();

    // 月面细节（极淡）
    ctx.save(); ctx.beginPath(); ctx.arc(MX, MY, MR, 0, 6.283); ctx.clip();
    ctx.globalAlpha = .05; ctx.fillStyle = '#8b96a6';
    [[-40,-36,42],[28,-62,26],[-6,44,50],[54,18,22],[-62,50,20]].forEach(([dx,dy,r]) => {
      ctx.beginPath(); ctx.arc(MX + dx, MY + dy, r, 0, 6.283); ctx.fill();
    });
    ctx.restore();

    // 薄云
    ctx.save();
    ctx.filter = 'blur(22px)';
    ctx.globalAlpha = .28;
    ctx.fillStyle = '#203c58';
    [[980,300,320,26],[1250,360,260,20],[880,392,240,16]].forEach(([x,y,rx,ry]) => {
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, -.06, 0, 6.283); ctx.fill();
    });
    ctx.restore();

    /* ================= 远山 ================= */
    const ridge = (pts, fill) => {
      ctx.beginPath(); ctx.moveTo(-80, H);
      pts.forEach(([x, y]) => ctx.lineTo(x, y));
      ctx.lineTo(W + 80, H); ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
    };
    ctx.save(); ctx.filter = 'blur(3px)';
    ridge([[0,592],[200,520],[400,570],[620,486],[840,562],[1060,500],[1260,556],[1440,516]], 'rgba(26,54,82,.75)');
    ctx.restore();
    ridge([[0,650],[180,590],[400,640],[640,566],[880,636],[1120,580],[1300,632],[1440,600]], '#143050');
    ridge([[0,690],[240,640],[500,682],[760,620],[1010,678],[1240,630],[1440,668]], '#173a5c');

    // 地平线雾
    const fog = ctx.createLinearGradient(0, 620, 0, 790);
    fog.addColorStop(0, 'rgba(140,180,220,0)');
    fog.addColorStop(.42, 'rgba(150,190,228,.13)');
    fog.addColorStop(1, 'rgba(140,180,220,0)');
    ctx.fillStyle = fog; ctx.fillRect(0, 600, W, 210);

    /* ================= 雪原 ================= */
    const gnd = ctx.createLinearGradient(0, 690, 0, H);
    gnd.addColorStop(0, '#c9dced');
    gnd.addColorStop(.16, '#aec6dd');
    gnd.addColorStop(.42, '#8aa6c4');
    gnd.addColorStop(.72, '#6b89a9');
    gnd.addColorStop(1, '#4d6885');
    ctx.fillStyle = gnd;
    ctx.beginPath();
    ctx.moveTo(-40, H); ctx.lineTo(-40, 706);
    for (let x = -40; x <= W + 40; x += 12) {
      ctx.lineTo(x, 706 + Math.sin(x / 340) * 26 + Math.sin(x / 120) * 7);
    }
    ctx.lineTo(W + 40, H); ctx.closePath(); ctx.fill();

    // 雪丘明暗
    const dunes = [
      [260, 812, 560, .05, 'light'], [900, 848, 620, .04, 'dark'],
      [1280, 918, 520, .03, 'light'], [420, 968, 700, .02, 'dark'],
      [820, 1032, 780, .02, 'light'], [1180, 796, 440, .06, 'dark']
    ];
    dunes.forEach(([x, y, rx, al, kind]) => {
      ctx.save(); ctx.translate(x, y); ctx.scale(1, .22);
      const dg = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      if (kind === 'light') {
        dg.addColorStop(0, `rgba(255,255,255,${al})`); dg.addColorStop(1, 'rgba(255,255,255,0)');
      } else {
        dg.addColorStop(0, `rgba(24,48,74,${al * 1.6})`); dg.addColorStop(1, 'rgba(24,48,74,0)');
      }
      ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.283); ctx.fill();
      ctx.restore();
    });

    /* ================= 提灯光 ================= */
    const LX = 668, LY = 706;

    // 地面光池
    ctx.save();
    ctx.translate(LX + 34, 806); ctx.scale(1.75, .40);
    const pool = ctx.createRadialGradient(0, 0, 10, 0, 0, 380);
    pool.addColorStop(0, 'rgba(255,222,158,.62)');
    pool.addColorStop(.26, 'rgba(255,198,120,.30)');
    pool.addColorStop(.62, 'rgba(255,176,92,.09)');
    pool.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0, 0, 380, 0, 6.283); ctx.fill();
    ctx.restore();

    glow(LX, LY, 300, 'rgba(255,214,146,ALPHA)', .30);
    glow(LX, LY, 90, 'rgba(255,248,222,ALPHA)', .55);

    /* ================= 远处灯座 ================= */
    drawAltar(1120, 716);

    /* ================= 脚印 ================= */
    [[112, 1058], [190, 1024], [268, 992], [340, 958], [402, 918], [452, 872], [486, 826]].forEach(([x, y], i) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(-.32);
      ctx.fillStyle = `rgba(30,54,80,${.30 - i * .028})`;
      ctx.beginPath(); ctx.ellipse(0, 0, 15, 7, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${.14 - i * .013})`;
      ctx.beginPath(); ctx.ellipse(i % 2 ? -2 : 2, -3.6, 11, 4, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    });

    /* ================= 人物投影 ================= */
    ctx.save();
    ctx.globalAlpha = .34; ctx.fillStyle = '#0d2338';
    ctx.beginPath();
    ctx.moveTo(LX - 60, LY + 120);
    ctx.quadraticCurveTo(LX - 320, LY + 150, LX - 620, LY + 214);
    ctx.quadraticCurveTo(LX - 300, LY + 208, LX - 66, LY + 168);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    /* ================= 人物 ================= */
    drawPerson(540, 946);

    /* ================= 灯芯 ================= */
    [[792, 742, .95, 0], [900, 668, .74, 1], [408, 720, .80, 2], [756, 862, .62, 3]].forEach(
      ([x, y, s, i]) => drawCore(x, y, s, i)
    );

    /* ================= 影子 ================= */
    drawShadow(322, 792, .82, -.18);
    drawShadow(1010, 872, .96, .12);
    drawShadow(1276, 762, .66, .3);

    /* ================= 飘雪 ================= */
    flakes.forEach(f => {
      const y = f.y, x = f.x;
      ctx.globalAlpha = f.a;
      ctx.fillStyle = '#f0f7ff';
      ctx.beginPath(); ctx.arc(x, y, f.r, 0, 6.283); ctx.fill();
      if (f.r > 2.6) {
        ctx.globalAlpha = f.a * .25;
        ctx.beginPath(); ctx.arc(x, y, f.r * 2.4, 0, 6.283); ctx.fill();
      }
    });
    ctx.globalAlpha = 1;

    /* ================= 辉光合成 ================= */
    ctx.save();
    ctx.filter = 'blur(26px)';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .85;
    ctx.drawImage(bloomC, 0, 0, W, H);
    ctx.restore();

    /* ================= 调色 ================= */
    // 冷暗部 / 暖高光
    const grade = ctx.createLinearGradient(0, 0, W, H);
    grade.addColorStop(0, 'rgba(30,70,120,.16)');
    grade.addColorStop(.55, 'rgba(0,0,0,0)');
    grade.addColorStop(1, 'rgba(255,170,90,.10)');
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = grade; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // 暗角
    const vg = ctx.createRadialGradient(W * .46, H * .55, 320, W * .5, H * .5, 1000);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(.66, 'rgba(0,0,0,.26)');
    vg.addColorStop(1, 'rgba(0,0,0,.66)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // 标题区压暗
    const tg = ctx.createRadialGradient(330, 210, 80, 330, 210, 720);
    tg.addColorStop(0, 'rgba(3,7,14,.48)');
    tg.addColorStop(1, 'rgba(3,7,14,0)');
    ctx.fillStyle = tg; ctx.fillRect(0, 0, 1040, 700);

    drawTitle();
  }

  function drawTitle(){
    const text = '夜行归灯';
    ctx.save();
    ctx.font = '190px "STXingkai","华文行楷","KaiTi","楷体",serif';
    ctx.textBaseline = 'top';
    // 外发光
    ctx.shadowColor = 'rgba(255,186,104,.55)';
    ctx.shadowBlur = 70;
    ctx.fillStyle = 'rgba(255,214,150,.35)';
    ctx.fillText(text, 78, 96);
    // 主体渐变
    ctx.shadowColor = 'rgba(255,170,80,.55)';
    ctx.shadowBlur = 26;
    const g = ctx.createLinearGradient(0, 110, 0, 300);
    g.addColorStop(0, '#fffdf2');
    g.addColorStop(.38, '#ffecc4');
    g.addColorStop(.75, '#f6c982');
    g.addColorStop(1, '#e8ac62');
    ctx.fillStyle = g;
    ctx.fillText(text, 78, 92);
    // 高光描边
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,250,232,.55)';
    ctx.strokeText(text, 78, 92);
    ctx.restore();
  }

  /* ---------- 灯座 ---------- */
  function drawAltar(x, y) {
    glow(x, y - 56, 230, 'rgba(255,206,130,ALPHA)', .26);
    ctx.save();
    ctx.filter = 'blur(1.4px)';
    ctx.fillStyle = '#152a42';
    ctx.beginPath(); ctx.ellipse(x, y + 18, 58, 15, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1d3550';
    ctx.beginPath(); ctx.ellipse(x, y + 8, 44, 11, 0, 0, 6.283); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#16283e';
    ctx.beginPath(); ctx.roundRect(x - 8, y - 68, 16, 76, 4); ctx.fill();

    const f = ctx.createRadialGradient(x, y - 82, 0, x, y - 82, 46);
    f.addColorStop(0, 'rgba(255,252,232,1)');
    f.addColorStop(.3, 'rgba(255,216,132,.62)');
    f.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = f; ctx.beginPath(); ctx.arc(x, y - 82, 46, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff9e0';
    ctx.beginPath(); ctx.ellipse(x, y - 84, 7.5, 13, 0, 0, 6.283); ctx.fill();
    glow(x, y - 82, 110, 'rgba(255,224,160,ALPHA)', .45);
  }

  /* ---------- 人物：背影 ---------- */
  function drawPerson(px, py) {
    // 地面投影
    ctx.save(); ctx.filter = 'blur(7px)';
    ctx.fillStyle = 'rgba(12,30,48,.5)';
    ctx.beginPath(); ctx.ellipse(px + 6, py + 6, 92, 18, 0, 0, 6.283); ctx.fill();
    ctx.restore();

    ctx.save(); ctx.translate(px, py);

    /* 靴子 */
    ctx.fillStyle = '#0a121c';
    ctx.beginPath(); ctx.roundRect(-46, -26, 40, 26, 8); ctx.fill();
    ctx.beginPath(); ctx.roundRect(8, -26, 40, 26, 8); ctx.fill();
    ctx.fillStyle = 'rgba(140,175,210,.10)';
    ctx.beginPath(); ctx.roundRect(-44, -24, 12, 22, 6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(10, -24, 12, 22, 6); ctx.fill();

    /* 斗篷 */
    const cloak = ctx.createLinearGradient(-90, -330, 90, -20);
    cloak.addColorStop(0, '#0c1622');
    cloak.addColorStop(.42, '#152739');
    cloak.addColorStop(.78, '#274257');
    cloak.addColorStop(1, '#1a2c3d');
    ctx.fillStyle = cloak;
    ctx.beginPath();
    ctx.moveTo(-64, -318);
    ctx.bezierCurveTo(-96, -240, -104, -140, -98, -58);
    ctx.quadraticCurveTo(-60, -38, -22, -46);
    ctx.quadraticCurveTo(0, -36, 22, -46);
    ctx.quadraticCurveTo(62, -38, 100, -58);
    ctx.bezierCurveTo(106, -140, 98, -240, 66, -318);
    ctx.quadraticCurveTo(0, -344, -64, -318);
    ctx.closePath(); ctx.fill();

    /* 衣褶 */
    ctx.strokeStyle = 'rgba(6,12,20,.42)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-34, -300); ctx.quadraticCurveTo(-48, -200, -40, -60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, -302); ctx.quadraticCurveTo(44, -200, 38, -62); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,190,225,.10)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-4, -296); ctx.quadraticCurveTo(6, -190, 0, -56); ctx.stroke();

    /* 兜帽（背面，尖顶） */
    const hood = ctx.createLinearGradient(-56, -420, 56, -320);
    hood.addColorStop(0, '#16283a');
    hood.addColorStop(.55, '#20real'.replace('real', '3a52'));
    hood.addColorStop(1, '#33536e');
    ctx.fillStyle = hood;
    ctx.beginPath();
    ctx.moveTo(-58, -330);
    ctx.quadraticCurveTo(-64, -400, -2, -416);
    ctx.quadraticCurveTo(58, -400, 56, -330);
    ctx.quadraticCurveTo(0, -306, -58, -330);
    ctx.closePath(); ctx.fill();
    // 兜帽褶皱
    ctx.strokeStyle = 'rgba(6,12,20,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-2, -414); ctx.quadraticCurveTo(-8, -370, -4, -330); ctx.stroke();

    /* 围巾：飘向左后 */
    ctx.fillStyle = '#7d3c34';
    ctx.beginPath();
    ctx.moveTo(-46, -322);
    ctx.bezierCurveTo(-96, -338, -142, -326, -176, -300);
    ctx.bezierCurveTo(-140, -306, -104, -300, -82, -294);
    ctx.bezierCurveTo(-104, -286, -132, -282, -160, -270);
    ctx.bezierCurveTo(-118, -282, -78, -296, -42, -306);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(210,120,96,.28)';
    ctx.beginPath();
    ctx.moveTo(-46, -318); ctx.bezierCurveTo(-96, -332, -138, -320, -168, -298);
    ctx.bezierCurveTo(-130, -308, -92, -306, -46, -310);
    ctx.closePath(); ctx.fill();

    /* 右臂 + 提灯 */
    const arm = ctx.createLinearGradient(60, -300, 140, -230);
    arm.addColorStop(0, '#152739');
    arm.addColorStop(1, '#2a4459');
    ctx.fillStyle = arm;
    ctx.beginPath();
    ctx.moveTo(56, -304);
    ctx.quadraticCurveTo(112, -286, 132, -248);
    ctx.quadraticCurveTo(142, -226, 124, -222);
    ctx.quadraticCurveTo(104, -232, 96, -258);
    ctx.quadraticCurveTo(78, -286, 52, -292);
    ctx.closePath(); ctx.fill();

    ctx.restore();

    /* 暖轮廓光（右） */
    ctx.save(); ctx.translate(px, py);
    ctx.strokeStyle = 'rgba(255,208,140,.80)'; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(58, -330); ctx.quadraticCurveTo(72, -250, 76, -180); ctx.stroke();
    ctx.beginPath(); ctx.quadraticCurveTo(96, -250, 122, -228); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,200,240,.16)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-62, -300); ctx.quadraticCurveTo(-92, -190, -92, -80); ctx.stroke();
    ctx.restore();

    /* 提灯 */
    const lx = px + 128, ly = py - 214;
    ctx.strokeStyle = 'rgba(30,22,14,.95)'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(lx, ly - 12); ctx.lineTo(lx, ly - 4); ctx.stroke();

    const metal = ctx.createLinearGradient(lx - 20, ly - 4, lx + 20, ly + 44);
    metal.addColorStop(0, '#3a2a19'); metal.addColorStop(.5, '#191209'); metal.addColorStop(1, '#2c2013');
    ctx.fillStyle = metal;
    ctx.beginPath(); ctx.roundRect(lx - 20, ly - 4, 40, 50, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(255,208,140,.5)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.roundRect(lx - 20, ly - 4, 40, 50, 9); ctx.stroke();

    const glass = ctx.createLinearGradient(lx, ly + 4, lx, ly + 42);
    glass.addColorStop(0, 'rgba(255,248,216,.98)');
    glass.addColorStop(.55, 'rgba(255,212,132,.85)');
    glass.addColorStop(1, 'rgba(255,182,92,.72)');
    ctx.fillStyle = glass;
    ctx.beginPath(); ctx.roundRect(lx - 14, ly + 4, 28, 34, 6); ctx.fill();

    ctx.fillStyle = '#fffdf4';
    ctx.beginPath(); ctx.ellipse(lx, ly + 22, 5.5, 9, 0, 0, 6.283); ctx.fill();
  }

  /* ---------- 灯芯 ---------- */
  function drawCore(x, y, s, i) {
    const r = 40 * s;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,252,238,.95)');
    g.addColorStop(.2, 'rgba(255,220,150,.55)');
    g.addColorStop(.6, 'rgba(255,190,100,.12)');
    g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fffdf6'; ctx.beginPath(); ctx.arc(x, y, 4.6 * s, 0, 6.283); ctx.fill();
    glow(x, y, 60 * s, 'rgba(255,214,140,ALPHA)', .5);
  }

  /* ---------- 影子 ---------- */
  function drawShadow(x, y, s, lean) {
    // 地面阴影
    ctx.save(); ctx.filter = 'blur(5px)';
    ctx.fillStyle = 'rgba(10,26,42,.45)';
    ctx.beginPath(); ctx.ellipse(x, y + 4, 52 * s, 11 * s, 0, 0, 6.283); ctx.fill();
    ctx.restore();

    ctx.save(); ctx.translate(x, y); ctx.rotate(lean * .08);

    const g = ctx.createLinearGradient(-34 * s, -150 * s, 34 * s, 10 * s);
    g.addColorStop(0, '#05080e');
    g.addColorStop(.55, '#03060b');
    g.addColorStop(1, '#0a1420');
    ctx.fillStyle = g;

    // 长袍
    ctx.beginPath();
    ctx.moveTo(-32 * s, -132 * s);
    ctx.quadraticCurveTo(-44 * s, -86 * s, -36 * s, -34 * s);
    ctx.quadraticCurveTo(-46 * s, -8 * s, -30 * s, 2 * s);
